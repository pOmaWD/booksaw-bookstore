<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksaw</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/style.css">

    <link rel="stylesheet" href="./css/components/header.css">

    <link rel="stylesheet" href="./css/pages/home.css">

</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header__top">
                <div class="container">
                    <div class="header__top-inner">
                        <ul class="social">
                            <li class="social__item">
                                <a href="/">
                                    <img src="./assets/icons/facebook-f-brands-solid-full.svg"
                                    alt="facebook"
                                    class="social__icon"
                                    width="17"
                                    height="17"
                                    loading="lazy"
                                    >
                                </a>
                            </li>
                            <li class="social__item">
                                <a href="/">
                                    <img src="./assets/icons/instagram-brands-solid-full.svg"
                                    alt="instagram"
                                    class="social__icon"
                                    width="17"
                                    height="17"
                                    loading="lazy"
                                    >
                                </a>
                            </li>
                            <li class="social__item">
                                <a href="/">
                                    <img src="./assets/icons/linkedin-in-brands-solid-full.svg"
                                    alt="linkedin"
                                    class="social__icon"
                                    width="17"
                                    height="17"
                                    loading="lazy"
                                    >
                                </a>
                            </li>
                            <li class="social__item">
                                <a href="/">
                                    <img src="./assets/icons/twitter-brands-solid-full.svg"
                                    alt="twitter"
                                    class="social__icon"
                                    width="17"
                                    height="17"
                                    loading="lazy"
                                    >
                                </a>
                            </li>
                            <li class="social__item">
                                <a href="/">
                                    <img src="./assets/icons/blogger-b-brands-solid-full.svg"
                                    alt="blogger"
                                    class="social__icon"
                                    width="17"
                                    height="17"
                                    loading="lazy"
                                    >
                                </a>
                            </li>
                        </ul>
                         <ul class="user-actions">
                            <li class="user-actions__item">
                                <a href="/" class="user-actions__link">
                                    <img src="./assets/icons/account-icon.svg"
                                    class="user-actions__icon"
                                    width="20"
                                    height="20"
                                    loading="lazy"
                                    >
                                    <span>ACCOUNT</span>
                                </a>
                            </li>
                            <li class="user-actions__item">
                                <a href="/" class="user-actions__link">
                                    <img src="./assets/icons/shopping-bag-iconp.svg"
                                    class="user-actions__icon"
                                    width="20"
                                    height="20"
                                    loading="lazy"
                                    >
                                    <span>CART:(0$)</span>
                                </a>
                            </li>
                            <li class="user-actions__item">
                                <button type="button" class="user-actions__btn">
                                    <img src="./assets/icons/search-icon.svg"
                                    class="user-actions__icon"
                                    width="20"
                                    height="20"
                                    loading="lazy"
                                    >
                                    <span>SEARCH</span>
                                </button>
                            </li>
                         </ul>
                    </div>
                </div>
            </div>
            <div class="header__bottom">
                <div class="container">
                    <div class="header__bottom-inner">
                        <a href="/" class="header__logo">
                            <img src="./assets/images/main-logo.png"
                            alt="Booksaw logo"
                            class="header__logo-image"
                            width="200"
                            height="30"
                            loading="lazy"
                            >
                        </a>
                        <div class="header__menu">
                            <nav class="nav">
                                <ul class="nav__list">
                                    <li class="nav__item">
                                        <a href="/" class="nav__link nav__link--active">HOME</a>
                                    </li>
                                    <li class="nav__item">
                                        <a href="/" class="nav__link">ABOUT</a>
                                    </li>
                                    <li class="nav__item">
                                        <a href="/" class="nav__link">PAGES</a>
                                    </li>
                                    <li class="nav__item">
                                        <a href="/" class="nav__link">SHOP</a>
                                    </li>
                                    <li class="nav__item">
                                        <a href="/" class="nav__link">ARTICLES</a>
                                    </li>
                                    <li class="nav__item">
                                        <a href="/" class="nav__link">CONTACT</a>
                                    </li>
                                </ul>
                            </nav>
                            <button type="button" class="burger" aria-label="Open menu">
                                <img src="./assets/icons/menu-burger-icon.svg"
                                class="burger__icon"
                                width="25"
                                height="25"
                                loading="lazy">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
